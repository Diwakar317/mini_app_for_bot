<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Camera Capture</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <h1>Face Capture</h1>
    <p class="subtitle">Align your face inside the oval and tap Mark Attendance.</p>

    <section class="camera-shell" aria-label="Camera preview">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="face-oval" aria-hidden="true"></div>
      <div id="loadingOverlay" class="loading hidden">Processing...</div>
    </section>

    <canvas id="captureCanvas" width="640" height="480" hidden></canvas>

    <button id="markBtn" type="button">Mark Attendance</button>
    <p id="statusText" class="status">Initializing camera...</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
